<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato-style restaurant listing card </title>
    <style>
        .restaurantcard{
            border: 2px  solid;
            width: 200px;
            padding: 20px;
            margin: 15px;
            border-radius: 10px
        }
    </style>
    
    

</head>
<body>
    <h1> Restaurants </h1>
    <article class="restaurantcard">
        <header>
            <h2>La Pino's Pizza</h2>
        </header>

        <section>
            <p><b>Cuisine: </b>Pizza, Italian</p>
            <p><b>Price: </b> ₹300 for two person</p>
            <p><b>Location: </b>Ahmedabad</p>
        </section>

        <footer>
            ★ 4.5 | Delivery: 30 min
        </footer>
    </article>
</body>
</html>
