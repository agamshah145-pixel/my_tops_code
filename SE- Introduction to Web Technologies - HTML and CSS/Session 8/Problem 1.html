<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        .product-card{
            width: 280px;
            border-radius: 5px;
            background-color: azure;
            margin: auto;
            padding: 15px;
        }
        .product-card img{
            height: 250px;
            width: 100%;
            object-fit: contain;
        }

        .product-card span{
            /* display: inline-block; */
            background-color: rgb(8, 167, 8);
            border-radius: 5px;
            color: white;
            padding: 5px;
            
        }

        .price{
            font-weight: bold;
            margin-top: 20px;
            font-size: 22px;
            margin-bottom: 5px;
        }

        .Ratings{
            color: green;
            
        }

        .product-card button{
            background-color: #2874f0;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px;
            border: none;
            color: white;
            font-size: 15px;

        }

        .product-card button:hover{
            background-color: #1259c7;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <img src="d:\HTML\Samsung galaxy ultra.webp" alt="Samsung Galaxy S26 Ultra">
    

        <h2>Samsung Galaxy S26 Ultra</h2>

        <span>4.4 ★</span>

        <p class="price">₹1,59,999/-</p>

        <p class="Ratings">10% off</p>

        <button>Buy Now</button>

    </div>
</body>
</html>
