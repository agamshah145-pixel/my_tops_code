<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <title>gamer-card</title>

    <style>
        body{
            background-color: rgba(2, 2, 40, 0.886);
        }

        .card{
            background-color: rgb(82, 82, 133);
            margin: 80px auto;
            border-radius: 10px;
            height: 400px;
            max-width: 500px;
            justify-content: center;
            align-items: center;

            
        }

        .card img{
            align-items: center;
            border: 2px solid green;
            color: greenyellow;
            border-radius: 50%;
            /* height: 180px; */
            /* width: 180px; */
            margin-top: 20px;
            
        }

        .card-title{
            text-align: center;
            color: black;
            font-size: 40px;
            font-weight: bold;

        }

        .btn{
            width: 100%;
            padding: 15px;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            font-size: 18px;
        }

        .btn:hover{
            transform:  scale(1.03)
        }

         @media (max-width: 576px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
            }

            .card img {
                width: 110px;
                height: 110px;
            }

           
        }

        /* Desktop */
        @media (min-width: 992px) {

            .card {
                max-width: 500px;
                padding: 45px;
            }

            .card img {
                width: 160px;
                height: 160px;
            }

           
        }
    </style>
  </head>
  <body>
    
    <div class="card">
        <img src="..." alt="Gamer avatar">
        <div class="card-body">
            <h5 class="card-title">AgamX</h5>
            <p class="card-text text-light">🎮 Competitive Gamer | Streamer | FPS Lover</p>
            <a href="#" class="btn btn-warning mt-3">🎮 Twitch</a>
            <section><a href="#" class="btn btn-primary mt-3">💬 Discord</a></section>
            <section><a href="#" class="btn btn-dark mt-3">🎯 Steam</a></section>
        </div>
    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
  </body>
</html>
