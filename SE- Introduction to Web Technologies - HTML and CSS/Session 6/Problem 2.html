<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart style product</title>
    <style>
        .product_title{
            border: 1px solid black;
            margin: 20px;
            padding: 15px;
            width: 300px;
            font-family: Arial, Helvetica, sans-serif;
        }
        
        .product-image{
            display: block;
            height: 250px;
            width: 250px;
            margin: auto;
        }

        .product_name{
            display: block;
            font-size: 20px;
            margin-top: 15px;
        }

        .price{
            display: inline-block;
            background-color: rgb(237, 235, 235);
            padding: 10px;
            font-weight: bold;
            margin-top: 10px;
        }
        .price{
            display: none;
        }
    
    </style>
</head>
<body>
    <div class="product_title">
        <img class="product-image" src="d:\HTML\Samsung galaxy ultra.webp" height="300px" alt="Smartphone">

        <span class="product_name">
            Samsung Galaxy Smartphone
        </span>
        <span class="price">
            ₹1,59,999/-
        </span>
    </div>
</body>
</html>
