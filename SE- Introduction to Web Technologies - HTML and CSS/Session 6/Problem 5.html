<!DOCTYPE html>

    <title>BookMyShow Movie Poster</title>
    <style>
        .grid{
            display: flex;

        }

        .movies{

        }

            color: white;
            padding: 6px 10px;

            font-weight: bold;
            margin-top: 90px;
        }
            /* Reusable spacing class
           Using one class avoids repeating the same margin and padding
           values in multiple selectors, making the CSS easier to maintain. */
        .spacing{
            margin: 10px;
            padding: 20px;
        }


    </style>
</head>
<body>

        BookMyShow Movies
    </h1>
