<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato style restaurant card</title>

    <style>
        .zomato{
            border: 2px solid black;
            border-radius: 10px;
            margin: 30px auto;
            padding: 20px;
            width: 350px;
        }

        .restaurant_name{
            margin: 0 0 15px 0;
            padding: 10px;
            border-bottom: 2px solid green;
        }

        .cuisine{
            margin: 10px;
            padding: 10px;
            border-bottom: 1px solid rgb(111, 114, 107);
        }
        
        .rating{
            border: 1px solid #9959f2;
            padding: 10px;
            color: #9959f2;
            font font-weight: bold;
        }

        

    </style>
</head>
<body>
    <div class="zomato">
        <h2 class="restaurant_name">
            La Pino's Pizza
        </h2>

        <p class="cuisine">
            <b>Cuisine: </b>Pizza, Italian
        </p>
        <p class="rating">
            ★ 4.5 | Delivery: 30 min
        </p>
    </div>
</body>
</html>
