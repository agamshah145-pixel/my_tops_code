<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Bar</title>
    <style>
        .Playlist{
            display: flex;
            gap: 30px;
            padding: 20px;
            background-color: black;   
            
        }

        .card{
            display: flex;
            align-items: center;
            width: 200px;
            height: 70px;
            padding: 10px;
            background-color: rgb(66, 64, 64);
            color: white;
            border-radius: 8px;
        }

        .song-name{
            font-weight: bold;
            margin-bottom: 5px;
        }

        .artist{
            font-size: 14px;
            color: antiquewhite;
        }
    </style>
</head>
<body>
    <div class="Playlist">

        <div class="card">
            <div style="margin-left: 10px;">
                <div class="song-name">
                Barsaat
                </div>
                <div class="artist">
                Banjaare, Roni
                </div>
                </div>
        </div>

        <div class="card">
            <div style="margin-left: 10px;">
            <div class="song-name">
            Yeh Awarapan
            </div>
                <div class="artist">
                Arijit Singh
                </div>
            </div>    
        </div>
        <div class="card">
            <div style="margin-left: 10px;">
            <div class="song-name">
            Saiyaara
            </div>
                <div class="artist">
                Tanishk Baghchi
                </div>
            </div>    
        </div>
        <div class="card">
            <div style="margin-left: 10px;">
            <div class="song-name">
            Tera Mera Rishta
            </div>
                <div class="artist">
                Pritam
                </div>
            </div>
        </div>
        <div class="card">
            <div style="margin-left: 10px;">
            <div class="song-name">
            Teri Mitti
            </div>
                <div class="artist">
                B Praak
                </div>
            </div>    
        </div>
    </div>
</body>
</html>
